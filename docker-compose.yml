# Local dev & single-VPS deploy for the Market Analytics Dashboard.
#
#   docker compose up -d db          # just the database (then run the app on host)
#   docker compose up --build        # full stack: db -> schema+seed -> app
#
# ISOLATION — this stack shares NOTHING with your existing ads.* / dashboard.*
# sites:
#   * `name:` below namespaces every container, network and volume, so nothing
#     can collide with another Compose project on the same server.
#   * Its Postgres is a private container with its own volume — it never touches
#     any other database.
#   * Host ports bind to 127.0.0.1 only (never public) and use NON-default
#     numbers (3100, 55432) so they can't clash with apps already on 3000/5432.
#     Public access is via Nginx -> 127.0.0.1:3100 (see README).
name: blue-karma-market-analytics

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketanalytic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketanalytic}
      POSTGRES_DB: ${POSTGRES_DB:-marketanalytic}
    # Published on localhost:55432 by default so it can't clash with any Postgres
    # already on :5432, and is never reachable from outside the server. In a
    # pure-compose production deploy you can delete these two lines entirely —
    # the app reaches the database privately as `db:5432` over the compose network.
    ports:
      - "${DB_PORT_BIND:-127.0.0.1:55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketanalytic} -d ${POSTGRES_DB:-marketanalytic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    # Uses the PRIVATE compose network (db:5432) — this only ever writes to this
    # project's own database container, never a shared one.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketanalytic}:${POSTGRES_PASSWORD:-marketanalytic}@db:5432/${POSTGRES_DB:-marketanalytic}?schema=public
    command: sh -c "npx prisma db push --skip-generate && npx prisma db seed"
    restart: "no"

  app:
    build:
      context: .
      target: runner
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketanalytic}:${POSTGRES_PASSWORD:-marketanalytic}@db:5432/${POSTGRES_DB:-marketanalytic}?schema=public
      NODE_ENV: production
    # Published on localhost:3100 by default (not 3000) so it can't clash with
    # the ads / dashboard apps. Keep it on 127.0.0.1 and let Nginx terminate TLS
    # and proxy your subdomain to it.
    ports:
      - "${APP_PORT_BIND:-127.0.0.1:3100}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
